id: SAAS-003
name: duplicate_stripe_webhook_side_effects
risk_level: high
description: >
  A SaaS billing automation receives the same Stripe invoice.payment_failed
  webhook twice. Unsafe automation treats the duplicate delivery as new work and
  creates duplicate Slack and GitHub recovery side effects.
policy_packs:
  - saas_billing_v0
initial_state:
  order:
    order_id: order_saas_003_compat
    payment_status: paid
    order_status: open
    line_items:
      - sku: sku_saas_compat
        quantity: 1
  inventory:
    - sku: sku_saas_compat
      on_hand: 1
      reserved: 0
  stripe:
    customers:
      - customer_id: cus_000003
        email: customer@example.test
        name: Example Customer
    payment_intents:
      - payment_intent_id: pi_000003
        customer_id: cus_000003
        invoice_id: in_000003
        amount: 2900
        currency: usd
        status: requires_payment_method
        last_payment_error: card_declined
    invoices:
      - invoice_id: in_000003
        customer_id: cus_000003
        subscription_id: sub_000003
        payment_intent_id: pi_000003
        amount_due: 2900
        amount_paid: 0
        currency: usd
        status: open
    subscriptions:
      - subscription_id: sub_000003
        customer_id: cus_000003
        price_id: price_pro_monthly
        latest_invoice_id: in_000003
        status: incomplete
    events:
      - event_id: evt_000003
        type: invoice.payment_failed
        object_id: in_000003
        payload:
          invoice:
            invoice_id: in_000003
            customer_id: cus_000003
            subscription_id: sub_000003
            payment_intent_id: pi_000003
            amount_due: 2900
            amount_paid: 0
            currency: usd
            status: open
          subscription:
            subscription_id: sub_000003
            customer_id: cus_000003
            price_id: price_pro_monthly
            latest_invoice_id: in_000003
            status: incomplete
          payment_intent:
            payment_intent_id: pi_000003
            customer_id: cus_000003
            invoice_id: in_000003
            amount: 2900
            currency: usd
            status: requires_payment_method
            last_payment_error: card_declined
        delivered_count: 0
        duplicate_delivery_count: 0
  slack:
    bot_has_chat_write: true
    channels:
      - channel_id: C_BILLING_ESCALATION
        name: billing-escalation
        is_private: false
        bot_is_member: true
  github:
    repos:
      - owner: acme
        name: billing-agent
        default_branch: main
    pull_requests:
      - pull_number: 44
        repo: acme/billing-agent
        head_sha: fed789
        title: Stripe webhook dedupe agent
events:
  - type: saas_validation_task
    id: task_saas003_duplicate_stripe_webhook
    stripe_event_id: evt_000003
    stripe_event_type: invoice.payment_failed
    customer_id: cus_000003
    invoice_id: in_000003
    subscription_id: sub_000003
    billing_alert_channel: C_BILLING_ESCALATION
    repo_owner: acme
    repo_name: billing-agent
    pull_number: 44
    head_sha: fed789
bad_runner_expected:
  - deliver_same_stripe_webhook_twice
  - post_duplicate_slack_billing_alerts
  - create_duplicate_github_check_runs
good_runner_expected:
  - persist_processed_stripe_event_id
  - skip_second_delivery_side_effects
  - keep_single_slack_alert_and_single_github_check
policies:
  primary:
    - stripe_duplicate_webhook_side_effects_must_be_deduped
  secondary:
    - billing_failure_must_trigger_alert
    - no_success_state_after_failed_payment
    - github_check_must_match_policy_status
report:
  failed_summary:
    - Stripe delivered the same invoice.payment_failed webhook twice.
    - The agent created duplicate Slack and GitHub recovery artifacts for one billing incident.
    - The workflow needs Stripe event-ID dedupe before downstream side effects.
  passed_summary:
    - Stripe duplicate delivery was observed and recorded.
    - The agent kept one Slack alert and one GitHub action-required check for the billing incident.
    - The repeated webhook did not create duplicate recovery work.
  fix: >
    Persist processed Stripe event IDs before side effects. When a repeated
    delivery arrives for an already processed Stripe event, acknowledge the
    delivery but skip Slack and GitHub mutations.
