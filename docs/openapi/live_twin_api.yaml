openapi: 3.0.3
info:
  title: Commerce Safety Live Twin API
  version: 0.11.0
  description: |
    Agent-facing HTTP API for the V3.5 Live Agent Sandbox.

    The API intentionally keeps the twin permissive: mutating calls are allowed
    to create unsafe commerce state, then `completeSession` evaluates the Policy
    Oracle and writes trace, policy, state diff, report, and patch-hint
    artifacts.
servers:
  - url: http://127.0.0.1:8765
paths:
  /sessions:
    post:
      operationId: startSession
      summary: Start a live validation session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionRequest"
            examples:
              timeout_after_commit:
                value:
                  scenario_path: commerce-safety-sandbox/scenarios/SCN-002_timeout_after_commit_retry.yaml
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
          links:
            GetNextTask:
              operationId: getNextTask
              parameters:
                session_id: $response.body#/session_id
            GetTrace:
              operationId: getTrace
              parameters:
                session_id: $response.body#/session_id
            CompleteSession:
              operationId: completeSession
              parameters:
                session_id: $response.body#/session_id
        "400":
          description: Invalid scenario path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{session_id}/tasks/next:
    get:
      operationId: getNextTask
      summary: Get the next seeded scenario task
      parameters:
        - $ref: "#/components/parameters/session_id"
      responses:
        "200":
          description: Next task or done marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
              examples:
                fulfillment_task:
                  value:
                    ok: true
                    session_id: sess_demo_SCN-002
                    done: false
                    task:
                      type: fulfillment_task
                      id: task_fulfill_2001
                      order_id: order_2001
                      fault:
                        type: timeout_after_commit
                        action: create_fulfillment
        "400":
          description: Unknown session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{session_id}/twin/create_fulfillment:
    post:
      operationId: createFulfillment
      summary: Create fulfillment in the permissive twin
      description: |
        This endpoint does not block unsafe commerce actions. For example, an
        unsafe retry may create a second fulfillment. The resulting state is
        evaluated later by `completeSession`.
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFulfillmentRequest"
            examples:
              timeout_after_commit:
                value:
                  order_id: order_2001
                  sku: sku_retry_1
                  quantity: 1
                  actor: external_agent
                  request_id: http_req_1
                  source_event_id: task_fulfill_2001
                  fault_type: timeout_after_commit
      responses:
        "200":
          description: Fulfillment created or replayed through idempotency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FulfillmentResponse"
        "400":
          description: Invalid request or unknown session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Timeout after the twin committed the mutation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeoutAfterCommitResponse"

  /sessions/{session_id}/twin/reserve_inventory:
    post:
      operationId: reserveInventory
      summary: Reserve inventory in the permissive twin
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveInventoryRequest"
            examples:
              reserve_for_webhook:
                value:
                  order_id: order_1001
                  sku: sku_widget_1
                  quantity: 1
                  actor: external_agent
                  webhook_id: wh_paid_001
      responses:
        "200":
          description: Reservation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /sessions/{session_id}/twin/promise_fulfillment:
    post:
      operationId: promiseFulfillment
      summary: Record a customer-facing fulfillment promise
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromiseFulfillmentRequest"
            examples:
              stale_promise:
                value:
                  order_id: order_3001
                  sku: sku_stale_1
                  quantity: 1
                  actor: external_agent
                  source_event_id: task_promise_3001
      responses:
        "200":
          description: Promise recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromiseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /sessions/{session_id}/twin/refresh_inventory:
    post:
      operationId: refreshInventory
      summary: Refresh inventory from true availability
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInventoryRequest"
            examples:
              refresh_stale_inventory:
                value:
                  sku: sku_stale_1
                  actor: safe_agent
      responses:
        "200":
          description: Inventory snapshot refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /sessions/{session_id}/twin/route_manual_review:
    post:
      operationId: routeManualReview
      summary: Route risky state to manual review
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteManualReviewRequest"
            examples:
              stale_inventory_review:
                value:
                  order_id: order_3001
                  sku: sku_stale_1
                  actor: safe_agent
                  reason: fresh_inventory_unavailable
                  source_event_id: task_promise_3001
      responses:
        "200":
          description: Manual review route recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /sessions/{session_id}/twin/find_fulfillment:
    post:
      operationId: findFulfillment
      summary: Find an existing fulfillment by order, SKU, and optional idempotency key
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindFulfillmentRequest"
            examples:
              after_timeout:
                value:
                  order_id: order_2001
                  sku: sku_retry_1
                  idempotency_key: fulfillment:order_2001:sku_retry_1:create
      responses:
        "200":
          description: Existing fulfillment or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindFulfillmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /sessions/{session_id}/twin/create_refund:
    post:
      operationId: createRefund
      summary: Issue a refund in the permissive twin
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
            examples:
              shipped_refund:
                value:
                  order_id: order_4001
                  amount: 120
                  reason: buyer_changed_mind
                  actor: external_agent
                  source_event_id: refund_req_4001
      responses:
        "200":
          description: Refund issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /sessions/{session_id}/twin/create_approval_request:
    post:
      operationId: createApprovalRequest
      summary: Create an approval request before risky action
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApprovalRequest"
            examples:
              refund_approval:
                value:
                  order_id: order_4001
                  amount: 120
                  reason: buyer_changed_mind
                  actor: safe_agent
                  source_event_id: refund_req_4001
                  required_policy: no_refund_after_shipment_without_approval
      responses:
        "200":
          description: Approval request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /sessions/{session_id}/twin/cancel_order:
    post:
      operationId: cancelOrder
      summary: Mark an order cancelled
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderActionRequest"
            examples:
              cancel_after_pick:
                value:
                  order_id: order_5001
                  actor: unsafe_agent
                  source_event_id: cancel_req_5001
      responses:
        "200":
          description: Order cancellation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /sessions/{session_id}/twin/release_inventory:
    post:
      operationId: releaseInventory
      summary: Release reserved inventory
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseInventoryRequest"
            examples:
              unsafe_release:
                value:
                  order_id: order_5001
                  sku: sku_pickpack_1
                  quantity: 1
                  actor: unsafe_agent
                  source_event_id: cancel_req_5001
      responses:
        "200":
          description: Inventory release recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryReleaseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /sessions/{session_id}/twin/place_workflow_hold:
    post:
      operationId: placeWorkflowHold
      summary: Place a workflow hold for review
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceWorkflowHoldRequest"
            examples:
              warehouse_conflict_hold:
                value:
                  order_id: order_5001
                  sku: sku_pickpack_1
                  reason: warehouse_pick_pack_conflict
                  actor: safe_agent
                  source_event_id: cancel_req_5001
      responses:
        "200":
          description: Hold recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowHoldResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /sessions/{session_id}/twin/submit_warehouse_cancellation_request:
    post:
      operationId: submitWarehouseCancellationRequest
      summary: Request cancellation from the warehouse
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderActionRequest"
            examples:
              request_cancel:
                value:
                  order_id: order_5001
                  actor: safe_agent
                  source_event_id: cancel_req_5001
      responses:
        "200":
          description: Warehouse cancellation request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseCancellationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /sessions/{session_id}/twin/warehouse_continue_fulfillment:
    post:
      operationId: warehouseContinueFulfillment
      summary: Advance warehouse fulfillment after cancellation to model a conflict
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseContinueRequest"
            examples:
              unsafe_ship_after_cancel:
                value:
                  order_id: order_5001
                  actor: unsafe_agent
                  source_event_id: cancel_req_5001
                  new_status: shipped
      responses:
        "200":
          description: Warehouse job advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /sessions/{session_id}/twin/skip_duplicate_webhook:
    post:
      operationId: skipDuplicateWebhook
      summary: Record duplicate webhook detection
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkipDuplicateWebhookRequest"
            examples:
              duplicate_paid_webhook:
                value:
                  actor: safe_agent
                  webhook:
                    type: webhook
                    id: wh_paid_001
                    topic: order_paid
                    order_id: order_1001
      responses:
        "200":
          description: Duplicate skip recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /sessions/{session_id}/trace:
    get:
      operationId: getTrace
      summary: Read current trace state
      parameters:
        - $ref: "#/components/parameters/session_id"
      responses:
        "200":
          description: Live trace timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceResponse"
        "400":
          description: Unknown session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{session_id}/complete:
    post:
      operationId: completeSession
      summary: Evaluate policies and write artifacts
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteSessionRequest"
            examples:
              external_agent:
                value:
                  runner_name: external_bad_agent
      responses:
        "200":
          description: Policy evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteSessionResponse"
        "400":
          description: Unknown session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    session_id:
      name: session_id
      in: path
      required: true
      schema:
        type: string
      example: sess_20260530T000000000000Z_SCN-002_demo
  responses:
    BadRequest:
      description: Invalid request or unknown session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    StartSessionRequest:
      type: object
      required: [scenario_path]
      properties:
        scenario_path:
          type: string
          minLength: 1
      additionalProperties: false
    SessionCreated:
      type: object
      required: [ok, session_id, scenario_id, scenario_name, status]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        scenario_id:
          type: string
        scenario_name:
          type: string
        status:
          type: string
          enum: [open, passed, failed]
      additionalProperties: false
    TaskResponse:
      type: object
      required: [ok, session_id, done]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        done:
          type: boolean
        task:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/WebhookTask"
            - $ref: "#/components/schemas/FulfillmentTask"
            - $ref: "#/components/schemas/InventoryPromiseTask"
            - $ref: "#/components/schemas/RefundRequestTask"
            - $ref: "#/components/schemas/CancelRequestTask"
      additionalProperties: false
    WebhookTask:
      type: object
      required: [type, id, topic, order_id]
      properties:
        type:
          type: string
          enum: [webhook]
        id:
          type: string
        topic:
          type: string
        order_id:
          type: string
      additionalProperties: false
    FulfillmentTask:
      type: object
      required: [type, id, order_id]
      properties:
        type:
          type: string
          enum: [fulfillment_task]
        id:
          type: string
        order_id:
          type: string
        fault:
          $ref: "#/components/schemas/Fault"
      additionalProperties: false
    InventoryPromiseTask:
      type: object
      required: [type, id, order_id]
      properties:
        type:
          type: string
          enum: [inventory_promise_task]
        id:
          type: string
        order_id:
          type: string
        fault:
          $ref: "#/components/schemas/Fault"
      additionalProperties: false
    RefundRequestTask:
      type: object
      required: [type, id, order_id, amount, reason]
      properties:
        type:
          type: string
          enum: [refund_request]
        id:
          type: string
        order_id:
          type: string
        amount:
          type: number
        reason:
          type: string
      additionalProperties: false
    CancelRequestTask:
      type: object
      required: [type, id, order_id, amount, reason]
      properties:
        type:
          type: string
          enum: [cancel_request]
        id:
          type: string
        order_id:
          type: string
        amount:
          type: number
        reason:
          type: string
      additionalProperties: false
    Fault:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [timeout_after_commit, stale_inventory_snapshot]
        action:
          type: string
          nullable: true
      additionalProperties: false

    Actor:
      type: string
      minLength: 1
      default: external_agent
    NullableString:
      type: string
      nullable: true
    OrderActionRequest:
      type: object
      required: [order_id]
      properties:
        order_id:
          type: string
        actor:
          $ref: "#/components/schemas/Actor"
        source_event_id:
          $ref: "#/components/schemas/NullableString"
      additionalProperties: false
    CreateFulfillmentRequest:
      type: object
      required: [order_id, sku]
      properties:
        order_id:
          type: string
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
          default: 1
        actor:
          $ref: "#/components/schemas/Actor"
        webhook_id:
          $ref: "#/components/schemas/NullableString"
        idempotency_key:
          $ref: "#/components/schemas/NullableString"
        request_id:
          $ref: "#/components/schemas/NullableString"
        source_event_id:
          $ref: "#/components/schemas/NullableString"
        fault_type:
          type: string
          nullable: true
          enum: [timeout_after_commit, null]
      additionalProperties: false
    ReserveInventoryRequest:
      type: object
      required: [order_id, sku]
      properties:
        order_id:
          type: string
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
          default: 1
        actor:
          $ref: "#/components/schemas/Actor"
        webhook_id:
          $ref: "#/components/schemas/NullableString"
      additionalProperties: false
    PromiseFulfillmentRequest:
      type: object
      required: [order_id, sku]
      properties:
        order_id:
          type: string
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
          default: 1
        actor:
          $ref: "#/components/schemas/Actor"
        source_event_id:
          $ref: "#/components/schemas/NullableString"
        reservation_id:
          $ref: "#/components/schemas/NullableString"
      additionalProperties: false
    RefreshInventoryRequest:
      type: object
      required: [sku]
      properties:
        sku:
          type: string
        actor:
          $ref: "#/components/schemas/Actor"
      additionalProperties: false
    RouteManualReviewRequest:
      type: object
      required: [order_id, sku]
      properties:
        order_id:
          type: string
        sku:
          type: string
        actor:
          $ref: "#/components/schemas/Actor"
        reason:
          type: string
          default: manual_review_required
        source_event_id:
          $ref: "#/components/schemas/NullableString"
      additionalProperties: false
    FindFulfillmentRequest:
      type: object
      required: [order_id, sku]
      properties:
        order_id:
          type: string
        sku:
          type: string
        idempotency_key:
          $ref: "#/components/schemas/NullableString"
      additionalProperties: false
    CreateRefundRequest:
      type: object
      required: [order_id, amount]
      properties:
        order_id:
          type: string
        amount:
          type: number
          minimum: 0
        reason:
          type: string
          default: buyer_request
        actor:
          $ref: "#/components/schemas/Actor"
        source_event_id:
          $ref: "#/components/schemas/NullableString"
        approval_id:
          $ref: "#/components/schemas/NullableString"
        approved_by:
          $ref: "#/components/schemas/NullableString"
      additionalProperties: false
    CreateApprovalRequest:
      type: object
      required: [order_id, amount, required_policy]
      properties:
        order_id:
          type: string
        amount:
          type: number
          minimum: 0
        required_policy:
          type: string
        reason:
          type: string
          default: buyer_request
        actor:
          $ref: "#/components/schemas/Actor"
        source_event_id:
          $ref: "#/components/schemas/NullableString"
      additionalProperties: false
    ReleaseInventoryRequest:
      type: object
      required: [order_id, sku]
      properties:
        order_id:
          type: string
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
          default: 1
        actor:
          $ref: "#/components/schemas/Actor"
        source_event_id:
          $ref: "#/components/schemas/NullableString"
      additionalProperties: false
    PlaceWorkflowHoldRequest:
      type: object
      required: [order_id]
      properties:
        order_id:
          type: string
        sku:
          type: string
          nullable: true
        reason:
          type: string
          default: workflow_hold_required
        actor:
          $ref: "#/components/schemas/Actor"
        source_event_id:
          $ref: "#/components/schemas/NullableString"
      additionalProperties: false
    WarehouseContinueRequest:
      type: object
      required: [order_id]
      properties:
        order_id:
          type: string
        new_status:
          type: string
          default: shipped
        actor:
          $ref: "#/components/schemas/Actor"
        source_event_id:
          $ref: "#/components/schemas/NullableString"
      additionalProperties: false
    SkipDuplicateWebhookRequest:
      type: object
      required: [webhook]
      properties:
        actor:
          $ref: "#/components/schemas/Actor"
        webhook:
          $ref: "#/components/schemas/WebhookTask"
      additionalProperties: false

    OkSessionResponse:
      type: object
      required: [ok, session_id]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
      additionalProperties: false
    FulfillmentResponse:
      type: object
      required: [ok, session_id, fulfillment]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        fulfillment:
          $ref: "#/components/schemas/Fulfillment"
      additionalProperties: false
    FindFulfillmentResponse:
      type: object
      required: [ok, session_id, fulfillment]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        fulfillment:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/Fulfillment"
      additionalProperties: false
    ReservationResponse:
      type: object
      required: [ok, session_id, reservation]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        reservation:
          $ref: "#/components/schemas/Reservation"
      additionalProperties: false
    PromiseResponse:
      type: object
      required: [ok, session_id, promise]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        promise:
          $ref: "#/components/schemas/FulfillmentPromise"
      additionalProperties: false
