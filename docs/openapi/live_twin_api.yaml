openapi: 3.0.3
info:
  title: Commerce Safety Live Twin API
  version: 0.12.0
  description: |
    Agent-facing HTTP API for the V3.5 Live Agent Sandbox.

    The API intentionally keeps the twin permissive: mutating calls are allowed
    to create unsafe commerce state, then `completeSession` evaluates the Policy
    Oracle and writes trace, policy, state diff, report, and patch-hint
    artifacts.
servers:
  - url: http://127.0.0.1:8765
paths:
  /sessions:
    post:
      operationId: startSession
      summary: Start a live validation session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionRequest"
            examples:
              timeout_after_commit:
                value:
                  scenario_path: commerce-safety-sandbox/scenarios/SCN-002_timeout_after_commit_retry.yaml
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
          links:
            GetNextTask:
              operationId: getNextTask
              parameters:
                session_id: $response.body#/session_id
            GetTrace:
              operationId: getTrace
              parameters:
                session_id: $response.body#/session_id
            CompleteSession:
              operationId: completeSession
              parameters:
                session_id: $response.body#/session_id
        "400":
          description: Invalid scenario path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/tasks/next:
    get:
      operationId: getNextTask
      summary: Get the next seeded scenario task
      parameters:
        - $ref: "#/components/parameters/session_id"
      responses:
        "200":
          description: Next task or done marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
              examples:
                fulfillment_task:
                  value:
                    ok: true
                    session_id: sess_demo_SCN-002
                    done: false
                    task:
                      type: fulfillment_task
                      id: task_fulfill_2001
                      order_id: order_2001
                      fault:
                        type: timeout_after_commit
                        action: create_fulfillment
        "400":
          description: Unknown session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/twin/create_fulfillment:
    post:
      operationId: createFulfillment
      summary: Create fulfillment in the permissive twin
      description: |
        This endpoint does not block unsafe commerce actions. For example, an
        unsafe retry may create a second fulfillment. The resulting state is
        evaluated later by `completeSession`.
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFulfillmentRequest"
            examples:
              timeout_after_commit:
                value:
                  order_id: order_2001
                  sku: sku_retry_1
                  quantity: 1
                  actor: external_agent
                  request_id: http_req_1
                  source_event_id: task_fulfill_2001
                  fault_type: timeout_after_commit
      responses:
        "200":
          description: Fulfillment created or replayed through idempotency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FulfillmentResponse"
        "400":
          description: Invalid request or unknown session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          description: Timeout after the twin committed the mutation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeoutAfterCommitResponse"

  /sessions/{session_id}/twin/reserve_inventory:
    post:
      operationId: reserveInventory
      summary: Reserve inventory in the permissive twin
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveInventoryRequest"
            examples:
              reserve_for_webhook:
                value:
                  order_id: order_1001
                  sku: sku_widget_1
                  quantity: 1
                  actor: external_agent
                  webhook_id: wh_paid_001
      responses:
        "200":
          description: Reservation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/twin/promise_fulfillment:
    post:
      operationId: promiseFulfillment
      summary: Record a customer-facing fulfillment promise
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromiseFulfillmentRequest"
            examples:
              stale_promise:
                value:
                  order_id: order_3001
                  sku: sku_stale_1
                  quantity: 1
                  actor: external_agent
                  source_event_id: task_promise_3001
      responses:
        "200":
          description: Promise recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromiseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/twin/refresh_inventory:
    post:
      operationId: refreshInventory
      summary: Refresh inventory from true availability
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshInventoryRequest"
            examples:
              refresh_stale_inventory:
                value:
                  sku: sku_stale_1
                  actor: safe_agent
      responses:
        "200":
          description: Inventory snapshot refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/twin/route_manual_review:
    post:
      operationId: routeManualReview
      summary: Route risky state to manual review
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteManualReviewRequest"
            examples:
              stale_inventory_review:
                value:
                  order_id: order_3001
                  sku: sku_stale_1
                  actor: safe_agent
                  reason: fresh_inventory_unavailable
                  source_event_id: task_promise_3001
      responses:
        "200":
          description: Manual review route recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/twin/find_fulfillment:
    post:
      operationId: findFulfillment
      summary: Find an existing fulfillment by order, SKU, and optional idempotency key
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindFulfillmentRequest"
            examples:
              after_timeout:
                value:
                  order_id: order_2001
                  sku: sku_retry_1
                  idempotency_key: fulfillment:order_2001:sku_retry_1:create
      responses:
        "200":
          description: Existing fulfillment or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindFulfillmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/twin/create_refund:
    post:
      operationId: createRefund
      summary: Issue a refund in the permissive twin
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
            examples:
              shipped_refund:
                value:
                  order_id: order_4001
                  amount: 120
                  reason: buyer_changed_mind
                  actor: external_agent
                  source_event_id: refund_req_4001
      responses:
        "200":
          description: Refund issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/twin/create_approval_request:
    post:
      operationId: createApprovalRequest
      summary: Create an approval request before risky action
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApprovalRequest"
            examples:
              refund_approval:
                value:
                  order_id: order_4001
                  amount: 120
                  reason: buyer_changed_mind
                  actor: safe_agent
                  source_event_id: refund_req_4001
                  required_policy: no_refund_after_shipment_without_approval
      responses:
        "200":
          description: Approval request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/twin/cancel_order:
    post:
      operationId: cancelOrder
      summary: Mark an order cancelled
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderActionRequest"
            examples:
              cancel_after_pick:
                value:
                  order_id: order_5001
                  actor: unsafe_agent
                  source_event_id: cancel_req_5001
      responses:
        "200":
          description: Order cancellation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/twin/release_inventory:
    post:
      operationId: releaseInventory
      summary: Release reserved inventory
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseInventoryRequest"
            examples:
              unsafe_release:
                value:
                  order_id: order_5001
                  sku: sku_pickpack_1
                  quantity: 1
                  actor: unsafe_agent
                  source_event_id: cancel_req_5001
      responses:
        "200":
          description: Inventory release recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryReleaseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/twin/place_workflow_hold:
    post:
      operationId: placeWorkflowHold
      summary: Place a workflow hold for review
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceWorkflowHoldRequest"
            examples:
              warehouse_conflict_hold:
                value:
                  order_id: order_5001
                  sku: sku_pickpack_1
                  reason: warehouse_pick_pack_conflict
                  actor: safe_agent
                  source_event_id: cancel_req_5001
      responses:
        "200":
          description: Hold recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowHoldResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/twin/submit_warehouse_cancellation_request:
    post:
      operationId: submitWarehouseCancellationRequest
      summary: Request cancellation from the warehouse
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderActionRequest"
            examples:
              request_cancel:
                value:
                  order_id: order_5001
                  actor: safe_agent
                  source_event_id: cancel_req_5001
      responses:
        "200":
          description: Warehouse cancellation request recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseCancellationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/twin/warehouse_continue_fulfillment:
    post:
      operationId: warehouseContinueFulfillment
      summary: Advance warehouse fulfillment after cancellation to model a conflict
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseContinueRequest"
            examples:
              unsafe_ship_after_cancel:
                value:
                  order_id: order_5001
                  actor: unsafe_agent
                  source_event_id: cancel_req_5001
                  new_status: shipped
      responses:
        "200":
          description: Warehouse job advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/twin/skip_duplicate_webhook:
    post:
      operationId: skipDuplicateWebhook
      summary: Record duplicate webhook detection
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkipDuplicateWebhookRequest"
            examples:
              duplicate_paid_webhook:
                value:
                  actor: safe_agent
                  webhook:
                    type: webhook
                    id: wh_paid_001
                    topic: order_paid
                    order_id: order_1001
      responses:
        "200":
          description: Duplicate skip recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/shopify/webhooks:
    post:
      operationId: shopifyReceiveWebhook
      summary: Receive a Shopify-like webhook delivery
      description: |
        Stage 12 Shopify-like Skin accepts `orders/paid` and
        `orders/cancelled` deliveries and maps Shopify order ids into the
        session's canonical commerce order ids.
      parameters:
        - $ref: "#/components/parameters/session_id"
        - $ref: "#/components/parameters/shopify_topic"
        - $ref: "#/components/parameters/shopify_webhook_id"
        - $ref: "#/components/parameters/shopify_shop_domain"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyOrderPaidWebhook"
            examples:
              orders_paid:
                value:
                  id: 1001
                  admin_graphql_api_id: gid://shopify/Order/1001
      responses:
        "202":
          description: Webhook normalized and recorded in the trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyWebhookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/shopify/webhooks/skip_duplicate:
    post:
      operationId: shopifySkipDuplicateWebhook
      summary: Record a Shopify-like duplicate webhook skip decision
      parameters:
        - $ref: "#/components/parameters/session_id"
        - $ref: "#/components/parameters/shopify_topic"
        - $ref: "#/components/parameters/shopify_webhook_id"
        - $ref: "#/components/parameters/shopify_shop_domain"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyOrderPaidWebhook"
            examples:
              duplicate_orders_paid:
                value:
                  id: 1001
                  admin_graphql_api_id: gid://shopify/Order/1001
      responses:
        "200":
          description: Duplicate skip recorded in the trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyWebhookSkipResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/shopify/admin/api/{api_version}/graphql.json:
    post:
      operationId: shopifyGraphQL
      summary: Run a Shopify-like Admin GraphQL mutation
      description: |
        Stage 12 supports the Shopify-shaped mutations required by the five P0
        scenarios. Unsupported mutations return explicit `_commerce_twin_stub`
        metadata instead of silently succeeding.
      parameters:
        - $ref: "#/components/parameters/session_id"
        - $ref: "#/components/parameters/api_version"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyGraphQLRequest"
            examples:
              fulfillment_create:
                value:
                  query: "mutation FulfillmentCreate($fulfillment: FulfillmentInput!) { fulfillmentCreate(fulfillment: $fulfillment) { fulfillment { id status } userErrors { field message } } }"
                  variables:
                    fulfillment:
                      lineItemsByFulfillmentOrder:
                        - fulfillmentOrderId: gid://shopify/FulfillmentOrder/2001
                          fulfillmentOrderLineItems:
                            - id: gid://shopify/FulfillmentOrderLineItem/2001-0
                              quantity: 1
                      metadata:
                        idempotency_key: order_2001:sku_retry_1:create_fulfillment
                        source_event_id: task_fulfill_2001
      responses:
        "200":
          description: Shopify-like GraphQL response or explicit unsupported stub
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyGraphQLResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          description: Timeout after the twin committed the mutation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyGraphQLTimeoutResponse"

  /sessions/{session_id}/shopify/admin/api/{api_version}/inventory_levels.json:
    get:
      operationId: shopifyInventoryLevels
      summary: Read Shopify-like inventory levels
      parameters:
        - $ref: "#/components/parameters/session_id"
        - $ref: "#/components/parameters/api_version"
        - name: inventory_item_ids
          in: query
          required: false
          schema:
            type: string
          example: gid://shopify/InventoryItem/sku_stale_1
      responses:
        "200":
          description: Shopify-like inventory levels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyInventoryLevelsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/shopify/admin/api/{api_version}/inventory_levels/adjust.json:
    post:
      operationId: shopifyInventoryAdjust
      summary: Apply a Shopify-like inventory adjustment
      parameters:
        - $ref: "#/components/parameters/session_id"
        - $ref: "#/components/parameters/api_version"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyInventoryAdjustRequest"
      responses:
        "200":
          description: Inventory adjustment mapped into the permissive twin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyGenericResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/shopify/actions/{shopify_action}:
    post:
      operationId: shopifyOpsAction
      summary: Run a Shopify-like commerce safety action
      parameters:
        - $ref: "#/components/parameters/session_id"
        - name: shopify_action
          in: path
          required: true
          schema:
            type: string
            enum:
              - promise_fulfillment
              - route_manual_review
              - create_approval_request
              - cancel_order
              - release_inventory
              - place_fulfillment_hold
              - submit_fulfillment_cancellation_request
              - warehouse_continue_fulfillment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopifyActionRequest"
      responses:
        "200":
          description: Shopify-like action mapped into the permissive twin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyGenericResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/shopify/coverage:
    get:
      operationId: shopifyCoverage
      summary: Read Shopify-like Skin V0 coverage metadata
      parameters:
        - $ref: "#/components/parameters/session_id"
      responses:
        "200":
          description: Shopify-like skin coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopifyCoverageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/amazon/sp-api/fba/inventory/v1/summaries:
    get:
      operationId: amazonGetInventorySummaries
      summary: Read Amazon-shaped FBA inventory summaries
      parameters:
        - $ref: "#/components/parameters/session_id"
      responses:
        "200":
          description: Amazon-shaped inventory summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmazonInventorySummariesResponse"
        "429":
          description: Retryable Amazon-shaped rate limit fault
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmazonRateLimitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/amazon/sp-api/listings/{api_version}/items/{seller_id}/{sku}:
    get:
      operationId: amazonGetListingItem
      summary: Read Amazon-shaped listing availability
      parameters:
        - $ref: "#/components/parameters/session_id"
        - $ref: "#/components/parameters/api_version"
        - $ref: "#/components/parameters/seller_id"
        - $ref: "#/components/parameters/sku"
      responses:
        "200":
          description: Amazon-shaped listing item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmazonListingItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: amazonPatchListingQuantity
      summary: Submit Amazon-shaped listing quantity update
      parameters:
        - $ref: "#/components/parameters/session_id"
        - $ref: "#/components/parameters/api_version"
        - $ref: "#/components/parameters/seller_id"
        - $ref: "#/components/parameters/sku"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmazonPatchListingRequest"
      responses:
        "202":
          description: Listing update accepted by the twin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmazonListingPatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/amazon/sp-api/orders/v0/orders/{amazon_order_id}:
    get:
      operationId: amazonGetOrder
      summary: Read Amazon-shaped order
      parameters:
        - $ref: "#/components/parameters/session_id"
        - $ref: "#/components/parameters/amazon_order_id"
      responses:
        "200":
          description: Amazon-shaped order response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmazonOrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/amazon/sp-api/orders/v0/orders/{amazon_order_id}/orderItems:
    get:
      operationId: amazonGetOrderItems
      summary: Read Amazon-shaped order items
      parameters:
        - $ref: "#/components/parameters/session_id"
        - $ref: "#/components/parameters/amazon_order_id"
      responses:
        "200":
          description: Amazon-shaped order items response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmazonOrderItemsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/amazon/sp-api/orders/v0/orders/{amazon_order_id}/shipmentConfirmation:
    post:
      operationId: amazonConfirmShipment
      summary: Confirm shipment through the Amazon-shaped Orders API
      parameters:
        - $ref: "#/components/parameters/session_id"
        - $ref: "#/components/parameters/amazon_order_id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmazonConfirmShipmentRequest"
      responses:
        "200":
          description: Amazon-shaped shipment confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmazonShipmentConfirmationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/amazon/sp-api/feeds/{api_version}/feeds:
    post:
      operationId: amazonCreateFeed
      summary: Submit an Amazon-shaped feed
      parameters:
        - $ref: "#/components/parameters/session_id"
        - $ref: "#/components/parameters/api_version"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmazonFeedRequest"
      responses:
        "202":
          description: Amazon-shaped feed accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmazonFeedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/amazon/sp-api/feeds/{api_version}/feeds/{feed_id}:
    get:
      operationId: amazonGetFeed
      summary: Read Amazon-shaped feed processing status
      parameters:
        - $ref: "#/components/parameters/session_id"
        - $ref: "#/components/parameters/api_version"
        - $ref: "#/components/parameters/feed_id"
      responses:
        "200":
          description: Amazon-shaped feed status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmazonFeedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/amazon/notifications:
    post:
      operationId: amazonInjectNotification
      summary: Inject Amazon-shaped notifications
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmazonNotificationRequest"
      responses:
        "202":
          description: Amazon-shaped notification accepted
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AmazonNotificationResponse"
                  - $ref: "#/components/schemas/AmazonStubResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/amazon/actions/{amazon_action}:
    post:
      operationId: amazonSellerOpsAction
      summary: Run an Amazon-shaped seller-ops action
      parameters:
        - $ref: "#/components/parameters/session_id"
        - $ref: "#/components/parameters/amazon_action"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmazonActionRequest"
      responses:
        "200":
          description: Amazon-shaped seller-ops action result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AmazonSellerOpsActionResponse"
                  - $ref: "#/components/schemas/AmazonStubResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/amazon/coverage:
    get:
      operationId: amazonCoverage
      summary: Read Amazon Seller Ops Skin V0 coverage metadata
      parameters:
        - $ref: "#/components/parameters/session_id"
      responses:
        "200":
          description: Amazon Seller Ops skin coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmazonCoverageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/trace:
    get:
      operationId: getTrace
      summary: Read current trace state
      parameters:
        - $ref: "#/components/parameters/session_id"
      responses:
        "200":
          description: Live trace timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceResponse"
        "400":
          description: Unknown session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{session_id}/complete:
    post:
      operationId: completeSession
      summary: Evaluate policies and write artifacts
      parameters:
        - $ref: "#/components/parameters/session_id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteSessionRequest"
            examples:
              external_agent:
                value:
                  runner_name: external_bad_agent
      responses:
        "200":
          description: Policy evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteSessionResponse"
        "400":
          description: Unknown session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    session_id:
      name: session_id
      in: path
      required: true
      schema:
        type: string
      example: sess_20260530T000000000000Z_SCN-002_demo
    api_version:
      name: api_version
      in: path
      required: true
      schema:
        type: string
        pattern: "^\\d{4}-\\d{2}(-\\d{2})?$"
      example: "2021-08-01"
    seller_id:
      name: seller_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: seller_123
    sku:
      name: sku
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: sku_stale_1
    amazon_order_id:
      name: amazon_order_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: AMZ-5001
    feed_id:
      name: feed_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: feed_001
    amazon_action:
      name: amazon_action
      in: path
      required: true
      schema:
        type: string
        enum:
          - promise_fulfillment
          - route_manual_review
          - cancel_order
          - place_workflow_hold
          - submit_warehouse_cancellation_request
      example: promise_fulfillment
    shopify_topic:
      name: X-Shopify-Topic
      in: header
      required: true
      schema:
        type: string
        enum: [orders/paid]
      example: orders/paid
    shopify_webhook_id:
      name: X-Shopify-Webhook-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      example: wh_paid_001
    shopify_shop_domain:
      name: X-Shopify-Shop-Domain
      in: header
      required: false
      schema:
        type: string
      example: acme.myshopify.com
  responses:
    BadRequest:
      description: Invalid request or unknown session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Unknown session, scenario, route, or session-scoped resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    StartSessionRequest:
      type: object
      properties:
        scenario_id:
          type: string
          minLength: 1
        scenario_path:
          type: string
          minLength: 1
      additionalProperties: false
    SessionCreated:
      type: object
      required: [ok, session_id, scenario_id, scenario_name, status]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        workspace_id:
          type: string
          nullable: true
        scenario_id:
          type: string
        scenario_name:
          type: string
        status:
          type: string
          enum: [open, passed, failed]
        ttl_expires_at:
          type: string
          format: date-time
          nullable: true
        retention_expires_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    TaskResponse:
      type: object
      required: [ok, session_id, done]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        done:
          type: boolean
        task:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/WebhookTask"
            - $ref: "#/components/schemas/FulfillmentTask"
            - $ref: "#/components/schemas/InventoryPromiseTask"
            - $ref: "#/components/schemas/RefundRequestTask"
            - $ref: "#/components/schemas/CancelRequestTask"
      additionalProperties: false
    WebhookTask:
      type: object
      required: [type, id, topic, order_id]
      properties:
        type:
          type: string
          enum: [webhook]
        id:
          type: string
        topic:
          type: string
        order_id:
          type: string
      additionalProperties: false
    FulfillmentTask:
      type: object
      required: [type, id, order_id]
      properties:
        type:
          type: string
          enum: [fulfillment_task]
        id:
          type: string
        order_id:
          type: string
        fault:
          $ref: "#/components/schemas/Fault"
      additionalProperties: false
    InventoryPromiseTask:
      type: object
      required: [type, id, order_id]
      properties:
        type:
          type: string
          enum: [inventory_promise_task]
        id:
          type: string
        order_id:
          type: string
        fault:
          $ref: "#/components/schemas/Fault"
      additionalProperties: false
    RefundRequestTask:
      type: object
      required: [type, id, order_id, amount, reason]
      properties:
        type:
          type: string
          enum: [refund_request]
        id:
          type: string
        order_id:
          type: string
        amount:
          type: number
        reason:
          type: string
      additionalProperties: false
    CancelRequestTask:
      type: object
      required: [type, id, order_id, amount, reason]
      properties:
        type:
          type: string
          enum: [cancel_request]
        id:
          type: string
        order_id:
          type: string
        amount:
          type: number
        reason:
          type: string
      additionalProperties: false
    Fault:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [timeout_after_commit, stale_inventory_snapshot]
        action:
          type: string
          nullable: true
      additionalProperties: false

    AmazonInventorySummariesResponse:
      type: object
      required: [ok, session_id, payload]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        payload:
          $ref: "#/components/schemas/AmazonInventorySummariesPayload"
      additionalProperties: false
    AmazonInventorySummariesPayload:
      type: object
      required: [inventorySummaries]
      properties:
        inventorySummaries:
          type: array
          items:
            $ref: "#/components/schemas/AmazonInventorySummary"
      additionalProperties: false
    AmazonInventorySummary:
      type: object
      required:
        - sellerSku
        - asin
        - fnSku
        - condition
        - marketplaceId
        - inventoryDetails
        - _commerce_twin
      properties:
        sellerSku:
          type: string
        asin:
          type: string
        fnSku:
          type: string
        condition:
          type: string
        marketplaceId:
          type: string
        inventoryDetails:
          $ref: "#/components/schemas/AmazonInventoryDetails"
        _commerce_twin:
          $ref: "#/components/schemas/AmazonTwinMetadata"
      additionalProperties: false
    AmazonInventoryDetails:
      type: object
      required:
        - fulfillableQuantity
        - totalReservedQuantity
        - pendingCustomerOrderQuantity
        - totalQuantity
      properties:
        fulfillableQuantity:
          type: integer
        totalReservedQuantity:
          type: integer
        pendingCustomerOrderQuantity:
          type: integer
        totalQuantity:
          type: integer
      additionalProperties: false
    AmazonRateLimitResponse:
      type: object
      required: [ok, session_id, error, message, retryAfterSeconds, _commerce_twin]
      properties:
        ok:
          type: boolean
          enum: [false]
        session_id:
          type: string
        error:
          type: string
          enum: [rate_limited]
        message:
          type: string
        retryAfterSeconds:
          type: integer
        _commerce_twin:
          $ref: "#/components/schemas/AmazonTwinMetadata"
      additionalProperties: false
    AmazonListingItemResponse:
      type: object
      required:
        - ok
        - session_id
        - sku
        - sellerId
        - sellerBinding
        - summaries
        - attributes
        - fulfillmentAvailability
        - _commerce_twin
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        sku:
          type: string
        sellerId:
          type: string
        sellerBinding:
          $ref: "#/components/schemas/AmazonSellerBinding"
        summaries:
          type: array
          items:
            $ref: "#/components/schemas/AmazonListingSummary"
        attributes:
          $ref: "#/components/schemas/AmazonListingAttributes"
        fulfillmentAvailability:
          type: array
          items:
            $ref: "#/components/schemas/AmazonFulfillmentAvailability"
        _commerce_twin:
          $ref: "#/components/schemas/AmazonTwinMetadata"
      additionalProperties: false
    AmazonSellerBinding:
      type: object
      required: [expectedSellerId, aliases, knownSeller]
      properties:
        expectedSellerId:
          type: string
        aliases:
          type: array
          items:
            type: string
        knownSeller:
          type: boolean
      additionalProperties: false
    AmazonListingSummary:
      type: object
      required: [marketplaceId, asin]
      properties:
        marketplaceId:
          type: string
        asin:
          type: string
      additionalProperties: false
    AmazonListingAttributes:
      type: object
      required: [fulfillment_availability]
      properties:
        fulfillment_availability:
          type: array
          items:
            type: object
            required: [fulfillment_channel_code, marketplace_id, quantity]
            properties:
              fulfillment_channel_code:
                type: string
              marketplace_id:
                type: string
              quantity:
                type: integer
            additionalProperties: false
      additionalProperties: false
    AmazonFulfillmentAvailability:
      type: object
      required: [fulfillmentChannelCode, marketplaceId, quantity]
      properties:
        fulfillmentChannelCode:
          type: string
        marketplaceId:
          type: string
        quantity:
          type: integer
      additionalProperties: false
    AmazonListingPatchResponse:
      type: object
      required: [ok, session_id, sku, status, _commerce_twin]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        sku:
          type: string
        status:
          type: string
        _commerce_twin:
          $ref: "#/components/schemas/AmazonTwinMetadata"
      additionalProperties: false
    AmazonOrderResponse:
      type: object
      required: [ok, session_id, payload]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        payload:
          $ref: "#/components/schemas/AmazonOrderPayload"
      additionalProperties: false
    AmazonOrderPayload:
      type: object
      required:
        - AmazonOrderId
        - OrderStatus
        - FulfillmentChannel
        - NumberOfItemsShipped
        - NumberOfItemsUnshipped
        - _commerce_twin
      properties:
        AmazonOrderId:
          type: string
        OrderStatus:
          type: string
        FulfillmentChannel:
          type: string
        NumberOfItemsShipped:
          type: integer
        NumberOfItemsUnshipped:
          type: integer
        _commerce_twin:
          $ref: "#/components/schemas/AmazonTwinMetadata"
      additionalProperties: false
    AmazonOrderItemsResponse:
      type: object
      required: [ok, session_id, payload]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        payload:
          $ref: "#/components/schemas/AmazonOrderItemsPayload"
      additionalProperties: false
    AmazonOrderItemsPayload:
      type: object
      required: [OrderItems]
      properties:
        OrderItems:
          type: array
          items:
            $ref: "#/components/schemas/AmazonOrderItem"
      additionalProperties: false
    AmazonOrderItem:
      type: object
      required: [OrderItemId, SellerSKU, ASIN, QuantityOrdered, _commerce_twin]
      properties:
        OrderItemId:
          type: string
        SellerSKU:
          type: string
        ASIN:
          type: string
        QuantityOrdered:
          type: integer
        _commerce_twin:
          $ref: "#/components/schemas/AmazonTwinMetadata"
      additionalProperties: false
    AmazonShipmentConfirmationResponse:
      type: object
      required: [ok, session_id, payload]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        payload:
          $ref: "#/components/schemas/AmazonShipmentConfirmationPayload"
      additionalProperties: false
    AmazonShipmentConfirmationPayload:
      type: object
      required: [AmazonOrderId, shipmentStatus, warehouseJob]
      properties:
        AmazonOrderId:
          type: string
        shipmentStatus:
          type: string
        warehouseJob:
          $ref: "#/components/schemas/WarehouseJob"
      additionalProperties: false
    AmazonFeedResponse:
      type: object
      required: [ok, session_id, payload]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        payload:
          $ref: "#/components/schemas/AmazonFeedPayload"
      additionalProperties: false
    AmazonFeedPayload:
      type: object
      required:
        - feedId
        - feedType
        - processingStatus
        - resultFeedDocumentId
        - processingReport
        - _commerce_twin
      properties:
        feedId:
          type: string
        feedType:
          type: string
        processingStatus:
          type: string
          enum: [IN_QUEUE, DONE]
        resultFeedDocumentId:
          type: string
        processingReport:
          $ref: "#/components/schemas/AmazonFeedProcessingReport"
        _commerce_twin:
          $ref: "#/components/schemas/AmazonTwinMetadata"
      additionalProperties: false
    AmazonFeedProcessingReport:
      type: object
      required: [documentId, processingSummary, results]
      properties:
        documentId:
          type: string
        processingSummary:
          $ref: "#/components/schemas/AmazonFeedProcessingSummary"
        results:
          type: array
          items:
            type: object
      additionalProperties: false
    AmazonFeedProcessingSummary:
      type: object
      required:
        - messagesProcessed
        - messagesSuccessful
        - messagesWithError
        - messagesWithWarning
      properties:
        messagesProcessed:
          type: integer
        messagesSuccessful:
          type: integer
        messagesWithError:
          type: integer
        messagesWithWarning:
          type: integer
      additionalProperties: false
    AmazonNotificationResponse:
      type: object
      required: [ok, session_id, event]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        event:
          type: object
          additionalProperties: true
      additionalProperties: false
    AmazonSellerOpsActionResponse:
      type: object
      required: [ok, session_id]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        promise:
          $ref: "#/components/schemas/FulfillmentPromise"
        workflow_hold:
          $ref: "#/components/schemas/WorkflowHold"
        warehouse_cancellation_request:
          $ref: "#/components/schemas/WarehouseCancellationRequest"
      additionalProperties: false
    AmazonCoverageResponse:
      type: object
      required: [ok, session_id, coverage]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        coverage:
          type: object
          additionalProperties: true
      additionalProperties: false
    AmazonStubResponse:
      type: object
      required: [ok, session_id, _commerce_twin_stub, coverage, stub, _commerce_twin]
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        _commerce_twin_stub:
          type: boolean
          enum: [true]
        coverage:
          type: string
          enum: [stub]
        stub:
          type: object
          additionalProperties: true
        _commerce_twin:
          $ref: "#/components/schemas/AmazonTwinMetadata"
        event:
          type: object
          additionalProperties: true
      additionalProperties: false
    AmazonTwinMetadata:
      type: object
      properties:
        coverage:
          type: string
        canonicalOrderId:
          type: string
        canonicalSku:
          type: string
        sellerId:
          type: string
        sellerAliases:
          type: array
          items:
            type: string
        marketplaceIds:
          type: array
          items:
            type: string
        snapshotVersion:
          type: string
          nullable: true
        lastSyncedAt:
          type: string
          nullable: true
        trueAvailable:
          type: integer
          nullable: true
        sellerSku:
          type: string
        submittedQuantity:
          type: integer
        liveQuantity:
          type: integer
        processing_state:
          type: string
        report_available_after:
          type: string
        retryable:
          type: boolean
        next_step:
          type: string
        fault:
          type: string
        operation:
          type: string
        stub:
          type: boolean
        unsupportedSurface:
          type: string
      additionalProperties: false
    AmazonActionRequest:
      type: object
      properties:
        amazonOrderId:
          type: string
        AmazonOrderId:
          type: string
        sellerSku:
          type: string
        SellerSKU:
          type: string
        sku:
          type: string
        asin:
          type: string
        ASIN:
          type: string
        quantity:
          type: integer
          minimum: 1
          default: 1
        reason:
          type: string
        actor:
          $ref: "#/components/schemas/Actor"
        sourceEventId:
          type: string
        source_event_id:
          type: string
        reservationId:
          type: string
      additionalProperties: true
    AmazonNotificationRequest:
      type: object
      required: [notificationType]
      properties:
        notificationType:
          type: string
          enum:
            - ORDER_CHANGE
            - LISTINGS_ITEM_MFN_QUANTITY_CHANGE
        payload:
          type: object
          additionalProperties: true
        actor:
          $ref: "#/components/schemas/Actor"
      additionalProperties: true
    AmazonConfirmShipmentRequest:
      type: object
      properties:
        packageDetail:
          type: object
          additionalProperties: true
        actor:
          $ref: "#/components/schemas/Actor"
        sourceEventId:
          type: string
      additionalProperties: true
    AmazonFeedRequest:
      type: object
      properties:
        feedType:
          type: string
          default: POST_ORDER_FULFILLMENT_DATA
        marketplaceIds:
          type: array
          items:
            type: string
        inputFeedDocumentId:
          type: string
        actor:
          $ref: "#/components/schemas/Actor"
      additionalProperties: true
    AmazonPatchListingRequest:
      type: object
      properties:
        productType:
          type: string
        patches:
          type: array
          items:
            type: object
            additionalProperties: true
        actor:
          $ref: "#/components/schemas/Actor"
      additionalProperties: true

    Actor:
      type: string
      minLength: 1
      default: external_agent
    NullableString:
      type: string
      nullable: true
    OrderActionRequest:
      type: object
      required: [order_id]
      properties:
        order_id:
          type: string
        actor:
          $ref: "#/components/schemas/Actor"
        source_event_id:
          $ref: "#/components/schemas/NullableString"
      additionalProperties: false
    CreateFulfillmentRequest:
      type: object
      required: [order_id, sku]
      properties:
        order_id:
          type: string
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
          default: 1
        actor:
          $ref: "#/components/schemas/Actor"
        webhook_id:
          $ref: "#/components/schemas/NullableString"
        idempotency_key:
          $ref: "#/components/schemas/NullableString"
        request_id:
          $ref: "#/components/schemas/NullableString"
        source_event_id:
          $ref: "#/components/schemas/NullableString"
        fault_type:
          type: string
          nullable: true
