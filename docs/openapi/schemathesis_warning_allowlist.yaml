allowed_warnings: []
policy: zero_schemathesis_warnings
fixture_generator: commerce_safety.live.schemathesis_fixtures
reason: >
  Schemathesis runs against a generated fixture spec that injects live session
  ids, session-scoped feed ids, realistic path parameters, and operation-level
