allowed_warnings:
  - schema_validation_mismatch_for_session_bound_paths
reason: >
  Schemathesis standalone examples and coverage phases generate arbitrary
  session_id values for session-bound paths. The API correctly rejects unknown
  sessions with documented 400 responses; deterministic Stage 10 smoke covers
  valid session-created paths for every P0 scenario.
session_bound_paths:
  - /sessions/{session_id}/tasks/next
  - /sessions/{session_id}/trace
  - /sessions/{session_id}/complete
  - /sessions/{session_id}/twin/create_fulfillment
